<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot Navigation Scroll Indicator</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'DM Sans', Arial, sans-serif;
      scroll-behavior: smooth;
    }
    body {
      background: #111;
      color: #f5f5f5;
      min-height: 200vh;
    }
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border-bottom: 1px solid #222;
    }
    /* Dot Navigation Styles */
    .dot-nav {
      position: fixed;
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 1000;
    }
    .dot-nav-btn {
      position: relative;
      width: 16px;
      height: 16px;
      background: #444;
      border-radius: 999px;
      border: none;
      outline: none;
      cursor: pointer;
      transition: background 0.2s, width 0.3s, height 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .dot-nav-btn.active {
      background: #f5f5f5;
      width: 16px;
      height: 40px;
      border-radius: 999px;
      transition: background 0.2s, width 0.3s, height 0.3s;
    }
    .dot-nav-btn .dot-label {
      position: absolute;
      right: 120%;
      top: 50%;
      transform: translateY(-50%) scale(0.95);
      background: #222;
      color: #f5f5f5;
      font-size: 0.95rem;
      padding: 0.25em 0.75em;
      border-radius: 0.5em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      letter-spacing: 0.05em;
    }
    .dot-nav-btn:hover .dot-label,
    .dot-nav-btn:focus .dot-label {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }
    .dot-nav-btn.active {
      background: #f5f5f5;
    }
    .dot-nav-btn.active .dot-label {
      color: #111;
      background: #f5f5f5;
    }
    /* Hide on small screens */
    @media (max-width: 600px) {
      .dot-nav { display: none; }
    }
  </style>
</head>
<body>
  <nav class="dot-nav" aria-label="Section navigation">
    <button class="dot-nav-btn" data-section="home" aria-label="Home"><span class="dot-label">Home</span></button>
    <button class="dot-nav-btn" data-section="about" aria-label="About"><span class="dot-label">About</span></button>
    <button class="dot-nav-btn" data-section="work" aria-label="Work"><span class="dot-label">Work</span></button>
    <button class="dot-nav-btn" data-section="process" aria-label="Process"><span class="dot-label">Process</span></button>
    <button class="dot-nav-btn" data-section="contact" aria-label="Contact"><span class="dot-label">Contact</span></button>
  </nav>
  <section id="home" style="background:#181818;">Home</section>
  <section id="about" style="background:#15161a;">About</section>
  <section id="work" style="background:#181818;">Work</section>
  <section id="process" style="background:#15161a;">Process</section>
  <section id="contact" style="background:#181818;">Contact</section>
  <script>
    const sections = ['home', 'about', 'work', 'process', 'contact'];
    const navBtns = document.querySelectorAll('.dot-nav-btn');
    // Scroll to section on click
    navBtns.forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        const id = btn.getAttribute('data-section');
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
    // IntersectionObserver to update active dot
    const observer = new window.IntersectionObserver((entries) => {
      let mostVisible = null;
      let maxRatio = 0;
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > maxRatio) {
          mostVisible = entry.target;
          maxRatio = entry.intersectionRatio;
        }
      });
      if (mostVisible) {
        const id = mostVisible.getAttribute('id');
        navBtns.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-section') === id);
        });
      }
    }, {
      threshold: Array.from({length: 21}, (_, i) => i / 20)
    });
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
  </script>
</body>
</html>
